server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location = /instance-info {
        default_type application/json;
        return 200 '{"instance":"${INSTANCE_NAME}","zone":"${ZONE_NAME}"}';
    }
}

