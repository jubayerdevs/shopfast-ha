events {}

http {
    log_format shopfast
        '$time_iso8601 client=$remote_addr '
        'backend=$upstream_addr status=$status '
        'upstream_status=$upstream_status '
        'request="$request"';

    access_log /var/log/nginx/access.log shopfast;

    upstream shopfast_backend {
        # Passive health checks in open-source NGINX
        server web-a:80 max_fails=1 fail_timeout=10s;
        server web-b:80 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://shopfast_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;

            proxy_next_upstream error timeout
                http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
